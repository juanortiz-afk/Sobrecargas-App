<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0F1014" />
<title>Sobrecarga</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0F1014;
  --surface: #181A20;
  --surface2: #1F2128;
  --border: #272932;
  --text: #EDECEA;
  --muted: #6B6E7A;
  --accent: #C8FF57;
  --accent-dim: rgba(200,255,87,0.12);
  --red: #FF5F5F;
  --red-dim: rgba(255,95,95,0.12);
  --mono: 'SF Mono','Roboto Mono',ui-monospace,monospace;
  --sans: -apple-system,system-ui,'Segoe UI',sans-serif;
  --radius: 14px;
}
html, body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

/* VIEWS */
.view { display: none; padding: 20px 16px 100px; max-width: 480px; margin: 0 auto; }
.view.active { display: block; }

/* HEADER */
.hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
.hdr-title { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
.hdr-back { font-size: 13px; color: var(--accent); font-weight: 600; padding: 6px 0; }
.hdr-action { font-size: 13px; color: var(--accent); font-weight: 600; }

/* SESSION LIST */
.session-grid { display: flex; flex-direction: column; gap: 10px; }
.session-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px 16px;
  display: flex; align-items: center; justify-content: space-between;
  cursor: pointer; transition: border-color .15s;
}
.session-card:active { border-color: var(--accent); }
.session-card-left { display: flex; flex-direction: column; gap: 4px; }
.session-name { font-size: 17px; font-weight: 700; }
.session-meta { font-size: 12px; color: var(--muted); font-family: var(--mono); }
.session-arrow { color: var(--muted); font-size: 18px; }
.session-card-actions { display: flex; gap: 8px; }
.btn-icon { width: 32px; height: 32px; border-radius: 8px; background: var(--surface2); color: var(--muted); font-size: 14px; display: flex; align-items: center; justify-content: center; }
.btn-icon:active { color: var(--red); }

.add-session-btn {
  margin-top: 12px; width: 100%; padding: 14px;
  background: var(--surface); border: 1px dashed var(--border);
  border-radius: var(--radius); color: var(--muted);
  font-size: 14px; font-weight: 600; text-align: center;
}
.add-session-btn:active { border-color: var(--accent); color: var(--accent); }

/* EXERCISE LIST IN SESSION */
.ex-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.ex-row {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px;
  display: flex; align-items: center; justify-content: space-between;
  cursor: pointer;
}
.ex-row:active { border-color: var(--accent); }
.ex-row-name { font-size: 15px; font-weight: 600; }
.ex-row-last { font-size: 12px; color: var(--muted); font-family: var(--mono); margin-top: 3px; }
.ex-row-right { display: flex; align-items: center; gap: 10px; }
.stag-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); flex-shrink: 0; }

.add-ex-btn {
  width: 100%; padding: 13px;
  background: var(--surface); border: 1px dashed var(--border);
  border-radius: var(--radius); color: var(--muted);
  font-size: 14px; font-weight: 600; text-align: center;
}
.add-ex-btn:active { border-color: var(--accent); color: var(--accent); }

/* LOG VIEW */
.readout {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 22px 20px; margin-bottom: 16px;
}
.readout-label { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-bottom: 6px; letter-spacing: 1px; }
.readout-num { font-family: var(--mono); font-size: 54px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.readout-unit { font-size: 20px; color: var(--muted); margin-left: 4px; font-weight: 500; }
.readout-sub { font-family: var(--mono); font-size: 13px; color: var(--muted); margin-top: 8px; }
.readout-empty { font-family: var(--mono); font-size: 14px; color: var(--muted); padding: 6px 0; }
.stag-banner {
  margin-top: 12px; background: var(--red-dim); color: var(--red);
  font-family: var(--mono); font-size: 12px; padding: 8px 10px;
  border-radius: 8px; border: 1px solid rgba(255,95,95,0.25);
}

/* FORM */
.form { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 14px; margin-bottom: 14px; }
.row-split { display: flex; gap: 12px; }
.stepper { display: flex; flex-direction: column; gap: 6px; flex: 1; }
.stepper-label { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; }
.stepper-ctrl { display: flex; align-items: center; background: var(--surface2); border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
.stepper-ctrl button { width: 46px; height: 46px; font-size: 22px; color: var(--text); flex-shrink: 0; }
.stepper-ctrl input {
  flex: 1; background: transparent; border: none; color: var(--text);
  text-align: center; font-family: var(--mono); font-size: 18px; font-weight: 700; outline: none; width: 100%; min-width: 0;
}
.stepper-ctrl.big input { font-size: 28px; font-weight: 800; }

.save-btn { background: var(--accent); color: #0F1014; border: none; border-radius: 12px; padding: 16px 0; font-size: 16px; font-weight: 800; width: 100%; letter-spacing: 0.2px; }
.save-btn:active { opacity: 0.85; }
.error-txt { font-size: 13px; color: var(--red); }

/* HISTORY */
.hist-toggle { width: 100%; color: var(--muted); font-size: 13px; font-family: var(--mono); padding: 10px 0; text-align: center; }
.hist-list { display: flex; flex-direction: column; gap: 8px; }
.hist-row { display: flex; justify-content: space-between; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.hist-w { font-family: var(--mono); font-size: 16px; font-weight: 700; }
.hist-m { font-size: 12px; color: var(--muted); margin-top: 2px; }
.del-btn { font-size: 11px; color: var(--red); border: 1px solid rgba(255,95,95,0.3); border-radius: 7px; padding: 5px 9px; }

/* MODAL */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: flex-end; z-index: 100; }
.modal-overlay.hidden { display: none; }
.modal { background: var(--surface); border-radius: 20px 20px 0 0; padding: 24px 20px 48px; width: 100%; max-width: 480px; margin: 0 auto; }
.modal-title { font-size: 17px; font-weight: 800; margin-bottom: 16px; }
.modal-input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 13px 14px; color: var(--text); font-size: 15px; outline: none; font-family: inherit; }
.modal-input:focus { border-color: var(--accent); }
.modal-actions { display: flex; gap: 10px; margin-top: 14px; }
.modal-confirm { flex: 1; background: var(--accent); color: #0F1014; border-radius: 10px; padding: 13px; font-size: 15px; font-weight: 800; }
.modal-cancel { flex: 1; background: var(--surface2); color: var(--muted); border-radius: 10px; padding: 13px; font-size: 15px; font-weight: 600; }

/* TOAST */
.toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); background: var(--surface2); border: 1px solid var(--accent); color: var(--text); padding: 10px 20px; border-radius: 999px; font-size: 13px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,0.5); opacity: 0; pointer-events: none; transition: opacity .2s; white-space: nowrap; z-index: 200; }
.toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- VIEW: SESSIONS -->
<div class="view active" id="v-sessions">
  <div class="hdr">
    <div class="hdr-title">Sobrecarga</div>
    <button class="hdr-action" onclick="openModal('session')">+ Sesión</button>
    <button class="hdr-action" onclick="exportData()" style="margin-left:10px;">⭳</button>
    <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importData(event)">
    <button class="hdr-action" onclick="document.getElementById('importFile').click()" style="margin-left:6px;">⭱</button>
  </div>
  <div class="session-grid" id="sessionGrid"></div>
</div>

<!-- VIEW: EXERCISES IN SESSION -->
<div class="view" id="v-exercises">
  <div class="hdr">
    <button class="hdr-back" onclick="goTo('v-sessions')">← Sesiones</button>
    <div class="hdr-title" id="exSessionName"></div>
    <button class="hdr-action" onclick="openModal('exercise')">+ Ejercicio</button>
  </div>
  <div class="ex-list" id="exList"></div>
</div>

<!-- VIEW: LOG EXERCISE -->
<div class="view" id="v-log">
  <div class="hdr">
    <button class="hdr-back" onclick="goTo('v-exercises')">← Volver</button>
    <div class="hdr-title" id="logExName" style="font-size:17px;"></div>
    <div></div>
  </div>
  <div class="readout" id="readout"></div>
  <div class="form">
    <div class="stepper">
      <div class="stepper-label">peso (kg)</div>
      <div class="stepper-ctrl big">
        <button onclick="step('weight',-2.5)">−</button>
        <input type="number" id="f-weight" value="0" />
        <button onclick="step('weight',2.5)">+</button>
      </div>
    </div>
    <div class="row-split">
      <div class="stepper">
        <div class="stepper-label">series</div>
        <div class="stepper-ctrl">
          <button onclick="step('sets',-1)">−</button>
          <input type="number" id="f-sets" value="3" />
          <button onclick="step('sets',1)">+</button>
        </div>
      </div>
      <div class="stepper">
        <div class="stepper-label">reps</div>
        <div class="stepper-ctrl">
          <button onclick="step('reps',-1)">−</button>
          <input type="number" id="f-reps" value="8" />
          <button onclick="step('reps',1)">+</button>
        </div>
      </div>
    </div>
    <div class="error-txt" id="f-error" style="display:none;"></div>
    <button class="save-btn" onclick="saveLog()">Guardar set</button>
  </div>
  <button class="hist-toggle" onclick="toggleHist()">ver historial ▼</button>
  <div class="hist-list" id="histList" style="display:none;"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay hidden" id="modal">
  <div class="modal">
    <div class="modal-title" id="modal-title">Nueva sesión</div>
    <input class="modal-input" id="modal-input" placeholder="" />
    <div class="modal-actions">
      <button class="modal-cancel" onclick="closeModal()">Cancelar</button>
      <button class="modal-confirm" onclick="confirmModal()">Crear</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const KEY = 'rh-sob-v2';
let db = load();
migrateOldData();
let curSession = null;
let curExercise = null;
let modalMode = null;
let showHist = false;

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || { sessions: [] }; }
  catch { return { sessions: [] }; }
}
function save() { localStorage.setItem(KEY, JSON.stringify(db)); }
function migrateOldData() {
  const OLD_KEY = 'rh-overload-logs';
  if (localStorage.getItem(OLD_KEY + '-migrated')) return;
  const raw = localStorage.getItem(OLD_KEY);
  if (!raw) return;
  let oldLogs;
  try { oldLogs = JSON.parse(raw); } catch { return; }
  if (!Array.isArray(oldLogs) || oldLogs.length === 0) return;

  let recovered = 0;
  let recSession = null;
  oldLogs.forEach(log => {
    let placed = false;
    for (const s of db.sessions) {
      const ex = (s.exercises||[]).find(e => e.name.trim().toLowerCase() === (log.exercise||'').trim().toLowerCase());
      if (ex) {
        ex.logs = ex.logs || [];
        const dup = ex.logs.some(l => l.date===log.date && l.weight===log.weight && l.sets===log.sets && l.reps===log.reps);
        if (!dup) { ex.logs.push({id: log.id||uid(), weight: log.weight, sets: log.sets, reps: log.reps, date: log.date}); recovered++; }
        placed = true; break;
      }
    }
    if (!placed) {
      if (!recSession) {
        recSession = db.sessions.find(s => s.name === 'Recuperados') || {id: uid(), name: 'Recuperados', exercises: []};
        if (!db.sessions.includes(recSession)) db.sessions.push(recSession);
      }
      let ex = recSession.exercises.find(e => e.name === log.exercise);
      if (!ex) { ex = {id: uid(), name: log.exercise || 'Sin nombre', logs: []}; recSession.exercises.push(ex); }
      ex.logs.push({id: log.id||uid(), weight: log.weight, sets: log.sets, reps: log.reps, date: log.date});
      recovered++;
    }
  });

  if (recovered > 0) {
    save();
    localStorage.setItem(OLD_KEY + '-migrated', '1');
    alert(`Se recuperaron ${recovered} registros de tu historial anterior.`);
  }
}

function exportData() {
  const blob = new Blob([JSON.stringify(db, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `sobrecarga-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const imported = JSON.parse(ev.target.result);
      if (!imported.sessions) throw new Error('formato inválido');

      let merged = 0;
      const allImportedExercises = [];
      imported.sessions.forEach(s => (s.exercises||[]).forEach(ex => allImportedExercises.push(ex)));

      let recSession = null;
      allImportedExercises.forEach(impEx => {
        let placed = false;
        for (const s of db.sessions) {
          const ex = (s.exercises||[]).find(e => e.name.trim().toLowerCase() === impEx.name.trim().toLowerCase());
          if (ex) {
            ex.logs = ex.logs || [];
            (impEx.logs||[]).forEach(log => {
              const dup = ex.logs.some(l => l.date===log.date && l.weight===log.weight && l.sets===log.sets && l.reps===log.reps);
              if (!dup) { ex.logs.push({id: log.id||uid(), weight: log.weight, sets: log.sets, reps: log.reps, date: log.date}); merged++; }
            });
            placed = true; break;
          }
        }
        if (!placed) {
          if (!recSession) {
            recSession = db.sessions.find(s => s.name === 'Recuperados') || {id: uid(), name: 'Recuperados', exercises: []};
            if (!db.sessions.includes(recSession)) db.sessions.push(recSession);
          }
          let ex = recSession.exercises.find(e => e.name === impEx.name);
          if (!ex) { ex = {id: uid(), name: impEx.name, logs: []}; recSession.exercises.push(ex); }
          (impEx.logs||[]).forEach(log => { ex.logs.push({id: log.id||uid(), weight: log.weight, sets: log.sets, reps: log.reps, date: log.date}); merged++; });
        }
      });

      save();
      renderSessions();
      alert(`${merged} registros combinados con tus sesiones existentes.`);
    } catch (err) {
      alert('Archivo inválido — no se pudo importar.');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function fmtDate(d) { return new Date(d).toLocaleDateString('es-CO',{day:'2-digit',month:'short'}); }
function daysAgo(iso) { return (Date.now() - new Date(iso).getTime()) / 86400000; }
function r1(n) { return Math.round(n*10)/10; }

// NAV
function goTo(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

// SESSIONS
function renderSessions() {
  const g = document.getElementById('sessionGrid');
  g.innerHTML = '';
  db.sessions.forEach(s => {
    const exCount = s.exercises ? s.exercises.length : 0;
    const d = document.createElement('div');
    d.className = 'session-card';
    d.innerHTML = `
      <div class="session-card-left" onclick="openSession('${s.id}')">
        <div class="session-name">${s.name}</div>
        <div class="session-meta">${exCount} ejercicio${exCount!==1?'s':''}</div>
      </div>
      <div class="session-card-actions">
        <button class="btn-icon" onclick="deleteSession('${s.id}',event)" title="Eliminar">✕</button>
        <div class="session-arrow" onclick="openSession('${s.id}')">›</div>
      </div>`;
    g.appendChild(d);
  });
}

function openSession(id) {
  curSession = db.sessions.find(s => s.id === id);
  if (!curSession) return;
  document.getElementById('exSessionName').textContent = curSession.name;
  renderExercises();
  goTo('v-exercises');
}

function deleteSession(id, e) {
  e.stopPropagation();
  if (!confirm('¿Eliminar esta sesión y todos sus registros?')) return;
  db.sessions = db.sessions.filter(s => s.id !== id);
  save(); renderSessions();
}

// EXERCISES
function renderExercises() {
  const list = document.getElementById('exList');
  list.innerHTML = '';
  const exs = curSession.exercises || [];
  exs.forEach(ex => {
    const logs = (ex.logs || []).sort((a,b) => new Date(b.date)-new Date(a.date));
    const last = logs[0];
    const stag = checkStag(logs);
    const d = document.createElement('div');
    d.className = 'ex-row';
    d.innerHTML = `
      <div onclick="openExercise('${ex.id}')">
        <div class="ex-row-name">${ex.name}</div>
        <div class="ex-row-last">${last ? last.weight+'kg · '+last.sets+'×'+last.reps+' · '+fmtDate(last.date) : 'sin registros'}</div>
      </div>
      <div class="ex-row-right">
        ${stag ? '<div class="stag-dot" title="Estancado"></div>' : ''}
        <button class="btn-icon" onclick="deleteExercise('${ex.id}',event)">✕</button>
        <div style="color:var(--muted);font-size:18px;" onclick="openExercise('${ex.id}')">›</div>
      </div>`;
    list.appendChild(d);
  });

  const addBtn = document.createElement('button');
  addBtn.className = 'add-ex-btn';
  addBtn.textContent = '+ Agregar ejercicio';
  addBtn.onclick = () => openModal('exercise');
  list.appendChild(addBtn);
}

function openExercise(id) {
  const ex = (curSession.exercises||[]).find(e => e.id === id);
  if (!ex) return;
  curExercise = ex;
  document.getElementById('logExName').textContent = ex.name;
  showHist = false;
  prefill();
  renderReadout();
  renderHist();
  goTo('v-log');
}

function deleteExercise(id, e) {
  e.stopPropagation();
  if (!confirm('¿Eliminar este ejercicio y sus registros?')) return;
  curSession.exercises = (curSession.exercises||[]).filter(e => e.id !== id);
  save(); renderExercises();
}

// LOG
function prefill() {
  const logs = (curExercise.logs||[]).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const last = logs[0];
  document.getElementById('f-weight').value = last ? last.weight : 0;
  document.getElementById('f-sets').value = last ? last.sets : 3;
  document.getElementById('f-reps').value = last ? last.reps : 8;
}

function checkStag(logs) {
  if (logs.length < 2) return false;
  const sorted = [...logs].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const recent = sorted[0];
  const older = sorted.find(e => daysAgo(e.date) >= 13 && e.date !== recent.date);
  return older && recent.weight <= older.weight;
}

function renderReadout() {
  const logs = (curExercise.logs||[]).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const last = logs[0];
  const stag = checkStag(logs);
  const el = document.getElementById('readout');
  let h = '<div class="readout-label">última vez</div>';
  if (last) {
    h += `<div class="readout-num">${last.weight}<span class="readout-unit">kg</span></div>
          <div class="readout-sub">${last.sets} × ${last.reps} reps · ${fmtDate(last.date)}</div>`;
  } else {
    h += '<div class="readout-empty">primer registro — calibra hoy</div>';
  }
  if (stag) h += '<div class="stag-banner">⚠ estancado — cambia peso o reps</div>';
  el.innerHTML = h;
}

function renderHist() {
  const tog = document.querySelector('.hist-toggle');
  const list = document.getElementById('histList');
  const logs = (curExercise.logs||[]).sort((a,b)=>new Date(b.date)-new Date(a.date));
  tog.textContent = showHist ? 'ocultar historial ▲' : `ver historial (${logs.length}) ▼`;
  list.style.display = showHist ? 'flex' : 'none';
  list.style.flexDirection = 'column';
  if (!showHist) return;
  list.innerHTML = logs.length ? logs.map(l => `
    <div class="hist-row">
      <div>
        <div class="hist-w">${l.weight}kg</div>
        <div class="hist-m">${l.sets} × ${l.reps} · ${fmtDate(l.date)}</div>
      </div>
      <button class="del-btn" onclick="deleteLog('${l.id}')">eliminar</button>
    </div>`).join('') : '<div style="color:var(--muted);font-size:13px;padding:10px 0;">Sin registros todavía.</div>';
}

function toggleHist() { showHist = !showHist; renderHist(); }

function step(field, delta) {
  const el = document.getElementById('f-'+field);
  const min = field==='weight' ? 0 : 1;
  el.value = Math.max(min, r1(Number(el.value)+delta));
}

function saveLog() {
  const weight = Number(document.getElementById('f-weight').value);
  const sets = Number(document.getElementById('f-sets').value);
  const reps = Number(document.getElementById('f-reps').value);
  const err = document.getElementById('f-error');
  if (weight <= 0) { err.textContent='El peso debe ser mayor a 0.'; err.style.display='block'; return; }
  err.style.display = 'none';
  const prev = (curExercise.logs||[]).sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
  if (!curExercise.logs) curExercise.logs = [];
  curExercise.logs.push({ id: uid(), weight, sets, reps, date: new Date().toISOString() });
  save();
  renderReadout(); renderHist();
  showToast(!prev || weight > prev.weight ? '🔥 Nuevo peso máximo' : '✓ Guardado');
}

function deleteLog(id) {
  curExercise.logs = (curExercise.logs||[]).filter(l => l.id !== id);
  save(); renderReadout(); renderHist();
}

// MODAL
function openModal(mode) {
  modalMode = mode;
  document.getElementById('modal-title').textContent = mode==='session' ? 'Nueva sesión' : 'Nuevo ejercicio';
  document.getElementById('modal-input').placeholder = mode==='session' ? 'Ej: Upper 1, Lower, Pierna...' : 'Ej: Press banca, Sentadilla...';
  document.getElementById('modal-input').value = '';
  document.getElementById('modal').classList.remove('hidden');
  setTimeout(()=>document.getElementById('modal-input').focus(), 100);
}

function closeModal() { document.getElementById('modal').classList.add('hidden'); }

function confirmModal() {
  const val = document.getElementById('modal-input').value.trim();
  if (!val) return;
  if (modalMode === 'session') {
    db.sessions.push({ id: uid(), name: val, exercises: [] });
    save(); renderSessions();
  } else {
    if (!curSession.exercises) curSession.exercises = [];
    curSession.exercises.push({ id: uid(), name: val, logs: [] });
    save(); renderExercises();
  }
  closeModal();
}

document.getElementById('modal-input').addEventListener('keydown', e => {
  if (e.key==='Enter') confirmModal();
  if (e.key==='Escape') closeModal();
});
document.getElementById('modal').addEventListener('click', e => {
  if (e.target === document.getElementById('modal')) closeModal();
});

// TOAST
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2000);
}

// INIT
renderSessions();
</script>
</body>
</html>
